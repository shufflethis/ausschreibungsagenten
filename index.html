<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#050b1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ausschreibungsagenten" />

    <!-- Primary Meta Tags -->
    <!-- Titel, Description und Canonical setzt der Prerender-Schritt je Route
         (scripts/prerender.mjs ersetzt den Marker unten). Im Entwicklungsmodus
         setzt React 19 sie beim Rendern im Browser. Der Titel hier ist nur die
         Rueckfallebene fuer das ungerenderte Geruest. -->
    <title>Ausschreibungsagenten.de – KI-Agenten für öffentliche Ausschreibungen</title>
    <meta name="author" content="Yawusa UG (haftungsbeschränkt)" />
    <!--ssg-head-->

    <!-- Open Graph und Twitter: hier stehen nur die seitenweit gleichen
         Angaben. og:type, og:url, og:title und og:description setzt die
         Seo-Komponente je Route; Twitter faellt auf die og-Angaben zurueck. -->
    <meta property="og:image" content="https://www.ausschreibungsagenten.de/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Erklärbare Ausschreibungssuche – 17 öffentliche Quellen live" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:site_name" content="Ausschreibungsagenten.de" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.ausschreibungsagenten.de/og-image.png" />

    <!-- Geo -->
    <meta name="geo.region" content="DE" />
    <meta name="geo.placename" content="Deutschland" />
    <meta name="language" content="German" />

    <!-- Bing Webmaster Tools Verifizierung -->
    <meta name="msvalidate.01" content="24EA9F9600F1A74E29DADDC501567FBA" />
    <link rel="alternate" type="text/markdown" href="/index.md" title="Ausschreibungsagenten.de Agent View" />
    <link rel="service-desc" type="application/vnd.oai.openapi+json" href="/openapi.json" />

</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
        // WebMCP draft API: read-only tender search for supporting browsers and agents.
        if (document.modelContext?.registerTool) {
            document.modelContext.registerTool({
                name: 'search_public_tenders',
                description: 'Search current public procurement notices by keyword, country and CPV code.',
                inputSchema: {
                    type: 'object',
                    properties: {
                        search: { type: 'string', description: 'Tender keyword or trade' },
                        country: { type: 'string', description: 'ISO-3 country code such as DEU or GBR' },
                        cpv: { type: 'string', description: 'Optional CPV prefix' }
                    },
                    required: ['search']
                },
                execute: async ({ search, country = 'DEU', cpv = '' }) => {
                    const query = new URLSearchParams({ search, country, limit: '6' });
                    if (cpv) query.set('cpv', cpv);
                    const response = await fetch('/api/tenders-public?' + query.toString());
                    return await response.json();
                }
            });
        }
    </script>
</body>

</html>
