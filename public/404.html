<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Seite nicht gefunden | Ausschreibungsagenten.de</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0e1a;
            color: #e2e8f0;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            text-align: center;
            padding: 2rem;
        }

        main { max-width: 28rem; }

        .code {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: .5rem;
        }

        h1 { font-size: 1.35rem; margin: 0 0 .75rem; }

        p { color: #94a3b8; line-height: 1.6; margin: 0 0 1.5rem; }

        a.btn {
            display: inline-block;
            padding: .7rem 1.4rem;
            border-radius: .6rem;
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }

        a.plain { color: #06b6d4; text-decoration: none; }
    </style>
</head>

<body>
    <main>
        <div class="code">404</div>
        <h1>Diese Seite gibt es nicht (mehr)</h1>
        <p>
            Die aufgerufene Adresse führt ins Leere. Vielleicht hilft die Startseite mit
            der Live-Suche weiter – oder der <a class="plain" href="/status">Quellenstatus</a>.
        </p>
        <a class="btn" href="/">Zur Startseite</a>
    </main>
</body>

</html>
